<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PROTOCOLO FANTASMA — Observatorio de San Patricio del Chañar</title>
<desc id="desc">Ilustración editorial vectorial del paisaje patagónico, viñedos, río y nodos de investigación pública. No representa una fotografía ni un hecho real específico.</desc>
